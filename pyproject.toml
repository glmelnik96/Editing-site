[project]
name = "editing-site"
version = "0.1.0"
description = "Онлайн-редактор видео на VM с API для агента"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30.2,<1",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
extend-select = ["E501", "B", "DTZ"]
